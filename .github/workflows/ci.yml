name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # validate.py shells out to pdftotext to check that answer-key quotes appear in the contracts.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r requirements.txt pytest ruff==0.8.4
      - run: ruff check .
      - run: python -m pytest -v tests
      - name: Dataset sanity checks
        run: python deal_darwin_dataset/scripts/validate.py
